<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jobs Tracker</title>
<meta name="theme-color" content="#0E6B66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jobs Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light dark;
  --bg:#F3F6F7;--surface:#FFFFFF;--ink:#15222B;--muted:#5B6B76;--line:#DCE4E8;
  --accent:#0E6B66;--accent-ink:#FFFFFF;--accent-soft:#DDF0EE;
  --s-sub-bg:#E4ECF7;--s-sub-fg:#234A7C;
  --s-test-bg:#FBEFD3;--s-test-fg:#7A5300;
  --s-int-bg:#E8E3F7;--s-int-fg:#4B3A8C;
  --s-off-bg:#DCF1E1;--s-off-fg:#1D6B34;
  --s-rej-bg:#F5E1E1;--s-rej-fg:#8A2B2B;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F171C;--surface:#17222A;--ink:#E6EEF2;--muted:#93A5B0;--line:#27363F;
    --accent:#4FC3BB;--accent-ink:#06211F;--accent-soft:#12332F;
    --s-sub-bg:#1B2C44;--s-sub-fg:#9CC0F0;
    --s-test-bg:#3A2D10;--s-test-fg:#EBC66B;
    --s-int-bg:#2A2447;--s-int-fg:#BDB0F0;
    --s-off-bg:#14301D;--s-off-fg:#86D39A;
    --s-rej-bg:#3A1C1C;--s-rej-fg:#EFA3A3;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
.app{max-width:1120px;margin:0 auto;padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(48px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:600 22px/1.2 var(--sans);margin:0;letter-spacing:-.01em}
h2{font:600 15px/1.3 var(--sans);margin:0}
button,input,select{font:inherit;color:inherit}
input,select{font-size:16px} /* mencegah zoom otomatis di iPhone */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.top>div{min-width:0}
.sync{margin:4px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;text-decoration:none;font-weight:500;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.banner{margin:0 0 16px;padding:10px 14px;border-radius:8px;background:var(--s-rej-bg);color:var(--s-rej-fg);font-size:13px}
.banner.info{background:var(--s-sub-bg);color:var(--s-sub-fg)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-bottom:6px}
.stat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;text-align:left}
.stat:hover{border-color:var(--accent)}
.stat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stat .n{font:500 22px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.stat .l{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.submitted{background:var(--s-sub-fg)}.dot.test{background:var(--s-test-fg)}.dot.interview{background:var(--s-int-fg)}.dot.offer{background:var(--s-off-fg)}.dot.rejected{background:var(--s-rej-fg)}
.progress{margin:8px 0 18px;color:var(--muted);font-size:13px;min-height:1.4em}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.listcol,.formcol{min-width:0}
@media (min-width:861px){
  .layout{grid-template-columns:minmax(0,1fr) 320px;gap:20px}
  .listcol{order:1}
  .formcol{order:2;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.toolbar input{flex:1 1 220px;min-width:0}
.toolbar select{flex:0 1 170px;min-width:0}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.toolbar input,.toolbar select{width:auto}
input::placeholder{color:var(--muted)}
.count{margin:0 0 8px;color:var(--muted);font-size:12px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.item{display:grid;grid-template-columns:96px minmax(0,1fr) auto;grid-template-areas:"date main st";gap:4px 14px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.item:last-child{border-bottom:0}
.date{grid-area:date;font:400 12px/1.6 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.main{grid-area:main;min-width:0}
.co{font-weight:600;overflow-wrap:anywhere}
.pos{overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.st{grid-area:st}
.pill{border:0;border-radius:6px;padding:5px 8px;font-weight:500;font-size:13px;cursor:pointer;width:auto;max-width:140px}
.pill.submitted{background:var(--s-sub-bg);color:var(--s-sub-fg)}
.pill.test{background:var(--s-test-bg);color:var(--s-test-fg)}
.pill.interview{background:var(--s-int-bg);color:var(--s-int-fg)}
.pill.offer{background:var(--s-off-bg);color:var(--s-off-fg)}
.pill.rejected{background:var(--s-rej-bg);color:var(--s-rej-fg)}
.pill.other{background:var(--line);color:var(--ink)}
.pill:disabled{opacity:.6;cursor:progress}
@media (max-width:560px){
  .item{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"date st" "main main"}
}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.card summary::-webkit-details-marker{display:none}
.card summary::after{content:"+";font:500 18px/1 var(--mono);color:var(--muted)}
.card[open] summary::after{content:"–"}
form{display:grid;gap:10px;padding:2px 14px 14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:400px){.row2{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
label input,label select{color:var(--ink);font-weight:400}
.hint{min-height:1.2em;font-size:12px;color:var(--muted)}
.msg{font-size:13px;min-height:1.3em}
.msg.ok{color:var(--s-off-fg)}.msg.err{color:var(--s-rej-fg)}

.setup{max-width:460px;margin:0 auto;padding-top:max(40px,env(safe-area-inset-top,0px));padding-bottom:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.setup .card{padding:16px 0 4px}
.setup h1{padding:0 14px;margin-bottom:6px}
.setup p{padding:0 14px;margin:0 0 10px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<main class="setup" id="setup" hidden>
  <div class="card">
    <h1>Jobs Tracker</h1>
    <p>Sambungkan aplikasi ke Google Sheet Anda. Dua isian ini disimpan hanya di perangkat ini.</p>
    <form id="setupform" autocomplete="off">
      <label for="s-url">Alamat API (URL Apps Script, berakhiran /exec)
        <input id="s-url" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec" required>
      </label>
      <label for="s-key">Kata sandi
        <input id="s-key" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn primary" id="setupbtn" type="submit">Simpan dan sambungkan</button>
      <div class="msg" id="setupmsg" role="status"></div>
    </form>
  </div>
</main>

<div class="app" id="appmain" hidden>
  <header class="top">
    <div>
      <h1>Jobs Tracker</h1>
      <p class="sync" id="sync" role="status">Memuat dari Google Sheets…</p>
    </div>
    <div class="actions">
      <button class="btn" id="refresh" type="button" disabled>Muat ulang</button>
      <a class="btn" id="opensheet" target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/1QrDp7cTkEpoHQ62JAiKUz_flHPeJSHxyfmf-0LMqUrk/edit">Buka Google Sheets</a>
      <button class="btn" id="logout" type="button">Putuskan</button>
    </div>
  </header>

  <div class="banner" id="banner" role="alert" hidden></div>

  <section class="stats" id="stats" aria-label="Ringkasan status"></section>
  <p class="progress" id="progress"></p>

  <div class="layout">
    <aside class="formcol">
      <details class="card" id="adddetails" open>
        <summary><h2>Tambah lamaran</h2></summary>
        <form id="addform" autocomplete="off">
          <div class="row2">
            <label for="f-date">Tanggal<input id="f-date" type="date" required></label>
            <label for="f-status">Status
              <select id="f-status"></select>
            </label>
          </div>
          <label for="f-company">Nama perusahaan<input id="f-company" type="text" required placeholder="mis. Tokopedia"></label>
          <div class="hint" id="duphint" aria-live="polite"></div>
          <label for="f-pos">Posisi<input id="f-pos" type="text" required placeholder="mis. Data Analyst"></label>
          <div class="row2">
            <label for="f-tipe">Tipe pekerjaan
              <select id="f-tipe"></select>
            </label>
            <label for="f-info">Sumber info<input id="f-info" type="text" list="infolist" placeholder="LinkedIn"></label>
          </div>
          <datalist id="infolist"></datalist>
          <label for="f-industri">Bidang perusahaan (opsional)<input id="f-industri" type="text" placeholder="mis. Teknologi, Bank, FMCG"></label>
          <button class="btn primary" id="addbtn" type="submit" disabled>Simpan ke Google Sheets</button>
          <div class="msg" id="formmsg" role="status"></div>
        </form>
      </details>
    </aside>

    <section class="listcol">
      <div class="toolbar">
        <input id="q" type="search" placeholder="Cari perusahaan, posisi, atau sumber" aria-label="Cari lamaran">
        <select id="ftipe" aria-label="Filter tipe pekerjaan"><option value="all">Semua tipe</option></select>
      </div>
      <p class="count" id="count"></p>
      <div class="list" id="list"></div>
    </section>
  </div>
</div>

<script>
(function(){
  var SHEET_FIRST=4;
  var CFG_KEY='jt_cfg', CACHE_KEY='jt_rows';
  var API_PREFIX='https://script.google.com/macros/s/';
  var STATUSES=[
    {key:'submitted',label:'Terkirim',write:'submitted'},
    {key:'test',label:'Tes',write:'Test'},
    {key:'interview',label:'Interview',write:'Interview'},
    {key:'offer',label:'Offer',write:'Offer'},
    {key:'rejected',label:'Ditolak',write:'Rejected'}
  ];
  var TIPE_DEFAULT=['Full Time','Internship','Bootcamp','Part Time','Contract'];
  var INFO_DEFAULT=['LinkedIn','Website Perusahaan','JobStreet','DEALLS','G-Form','Campus Hiring','Social Media','G-mail'];
  var MON={jan:0,feb:1,mar:2,apr:3,may:4,mei:4,jun:5,jul:6,aug:7,agu:7,ags:7,sep:8,oct:9,okt:9,nov:10,dec:11,des:11};
  var MID=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

  var $=function(id){return document.getElementById(id)};
  var rows=[], loaded=false, busy=false, logoutArmed=null;
  var filt={q:'',status:'all',tipe:'all'};

  /* ---------- penyimpanan lokal (hanya di perangkat ini) ---------- */
  function getCfg(){
    try{ var c=JSON.parse(localStorage.getItem(CFG_KEY)||'null'); return c&&c.url&&c.key?c:null }catch(_){ return null }
  }
  function setCfg(c){ try{ localStorage.setItem(CFG_KEY,JSON.stringify(c)) }catch(_){} }
  function clearAll(){ try{ localStorage.removeItem(CFG_KEY); localStorage.removeItem(CACHE_KEY) }catch(_){} }
  function readCache(){ try{ var v=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); return Array.isArray(v)?v:null }catch(_){ return null } }
  function writeCache(v){ try{ localStorage.setItem(CACHE_KEY,JSON.stringify(v)) }catch(_){} }

  /* ---------- panggilan ke Apps Script ---------- */
  async function api(action,payload,cfg){
    cfg=cfg||getCfg();
    if(!cfg) throw new Error('NO_CONFIG');
    var res, body=Object.assign({key:cfg.key,action:action},payload||{});
    try{
      res=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'});
    }catch(_){ throw new Error('NETWORK') }
    var j;
    try{ j=await res.json() }catch(_){ throw new Error('NOT_JSON') }
    if(!j||!j.ok) throw new Error((j&&j.error)||'Gagal');
    return j.data;
  }

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim()}

  function parseDate(s){
    s=String(s||'').trim(); var m;
    if((m=s.match(/^(\d{1,2})[\s\-\/.]+([A-Za-z]+)[\s\-\/.,]+(\d{4})$/))){
      var k=MON[m[2].toLowerCase().slice(0,3)];
      if(k!==undefined) return Date.UTC(+m[3],k,+m[1]);
    }
    if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return Date.UTC(+m[1],+m[2]-1,+m[3]);
    if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return Date.UTC(+m[3],+m[2]-1,+m[1]);
    return null;
  }
  function showDate(t,raw){
    if(t==null) return raw?raw:'Tanggal kosong';
    var d=new Date(t); return d.getUTCDate()+' '+MID[d.getUTCMonth()]+' '+d.getUTCFullYear();
  }
  function todayISO(){
    var d=new Date(), z=function(n){return String(n).padStart(2,'0')};
    return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
  }
  function statusKey(raw){
    var n=norm(raw);
    for(var i=0;i<STATUSES.length;i++){ if(STATUSES[i].key===n) return STATUSES[i].key; }
    return 'other';
  }
  function statusDef(key){ for(var i=0;i<STATUSES.length;i++){ if(STATUSES[i].key===key) return STATUSES[i]; } return null; }

  function parseRows(vals){
    var out=[];
    (vals||[]).forEach(function(r,i){
      r=r||[];
      var c=[0,1,2,3,4,5,6,7].map(function(k){return String(r[k]==null?'':r[k]).trim()});
      if(!c.some(Boolean)) return;
      out.push({row:SHEET_FIRST+i,no:c[0],tanggalRaw:c[1],t:parseDate(c[1]),info:c[2],perusahaan:c[3],industri:c[4],posisi:c[5],tipe:c[6],statusRaw:c[7],pending:false});
    });
    return out;
  }

  function errText(e,verb){
    var m=String((e&&e.message)||e||'');
    if(m==='BAD_KEY') return 'Kata sandi salah.';
    if(m==='SETUP_KEY') return 'Kata sandi di Code.gs belum diganti. Ganti dengan kata sandi minimal 16 karakter, lalu terapkan ulang.';
    if(m==='SHEET_CHANGED') return 'Isi sheet berubah sejak dimuat, jadi tidak ada yang diubah. Data dimuat ulang.';
    if(m==='NETWORK') return 'Tidak bisa terhubung. Periksa internet Anda, lalu coba lagi.';
    if(m==='NOT_JSON') return 'Alamat API tidak mengembalikan data. Pastikan penerapan Apps Script diatur ke akses "Siapa saja" dan alamatnya berakhiran /exec.';
    return 'Gagal '+verb+' data'+(m?': '+m.slice(0,160):'')+'.';
  }
  function banner(text,info){
    var b=$('banner'); if(!text){b.hidden=true;b.textContent='';return}
    b.hidden=false; b.className='banner'+(info?' info':''); b.textContent=text;
  }
  function setSync(t){ $('sync').textContent=t }
  function clock(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+'.'+String(d.getMinutes()).padStart(2,'0') }

  function counts(){
    var c={all:rows.length,submitted:0,test:0,interview:0,offer:0,rejected:0,other:0};
    rows.forEach(function(r){ c[statusKey(r.statusRaw)]++ });
    return c;
  }

  function renderStats(){
    var c=counts();
    var items=[{key:'all',label:'Semua'}].concat(STATUSES.map(function(s){return {key:s.key,label:s.label}}));
    $('stats').innerHTML=items.map(function(s){
      return '<button type="button" class="stat" data-status="'+s.key+'" aria-pressed="'+(filt.status===s.key)+'">'
        +'<span class="n">'+(loaded?c[s.key]:'–')+'</span>'
        +'<span class="l"><span class="dot '+(s.key==='all'?'':s.key)+'"></span>'+s.label+'</span></button>';
    }).join('');
    var adv=c.test+c.interview+c.offer;
    $('progress').textContent=loaded&&rows.length?(adv+' dari '+rows.length+' lamaran sudah maju ke tahap tes atau lebih.'):'';
  }

  function optionsFor(r){
    var k=statusKey(r.statusRaw), cur=k==='other'?'<option value="" selected disabled>'+esc(r.statusRaw||'Belum diisi')+'</option>':'';
    return cur+STATUSES.map(function(s){return '<option value="'+s.key+'"'+(s.key===k?' selected':'')+'>'+s.label+'</option>'}).join('');
  }

  function visible(){
    var q=norm(filt.q);
    return rows.filter(function(r){
      if(filt.status!=='all'&&statusKey(r.statusRaw)!==filt.status) return false;
      if(filt.tipe!=='all'&&r.tipe!==filt.tipe) return false;
      if(q){ var hay=norm([r.perusahaan,r.posisi,r.info,r.industri].join(' ')); if(hay.indexOf(q)<0) return false; }
      return true;
    }).sort(function(a,b){
      var ta=a.t==null?-Infinity:a.t, tb=b.t==null?-Infinity:b.t;
      return tb-ta||b.row-a.row;
    });
  }

  function renderList(){
    var el=$('list');
    if(!loaded){
      el.innerHTML='<div class="empty"><strong>Memuat lamaran…</strong>Daftar diambil langsung dari sheet Jobs Tracker.</div>';
      $('count').textContent=''; return;
    }
    var list=visible();
    $('count').textContent='Menampilkan '+list.length+' dari '+rows.length+' lamaran, terbaru di atas';
    if(!rows.length){ el.innerHTML='<div class="empty"><strong>Belum ada lamaran di sheet</strong>Isi form Tambah lamaran, barisnya langsung masuk ke Jobs Tracker.</div>'; return; }
    if(!list.length){ el.innerHTML='<div class="empty"><strong>Tidak ada yang cocok</strong>Ubah kata kunci atau filter status dan tipe.</div>'; return; }
    el.innerHTML=list.map(function(r){
      var k=statusKey(r.statusRaw), meta=[r.tipe,r.info].filter(Boolean).join(' · ');
      return '<article class="item">'
        +'<div class="date">'+esc(showDate(r.t,r.tanggalRaw))+'</div>'
        +'<div class="main"><div class="co">'+esc(r.perusahaan||'(tanpa nama)')+'</div>'
        +'<div class="pos">'+esc(r.posisi)+'</div>'
        +(meta?'<div class="meta">'+esc(meta)+'</div>':'')+'</div>'
        +'<div class="st"><select class="pill '+k+'" id="st-'+r.row+'" data-row="'+r.row+'" aria-label="Status lamaran '+esc(r.perusahaan)+'"'+(r.pending?' disabled':'')+'>'+optionsFor(r)+'</select></div>'
        +'</article>';
    }).join('');
  }

  function renderTipeFilter(){
    var set={}; rows.forEach(function(r){ if(r.tipe) set[r.tipe]=1 });
    var opts=Object.keys(set).sort();
    var sel=$('ftipe'), cur=filt.tipe;
    if(cur!=='all'&&!set[cur]) filt.tipe=cur='all';
    sel.innerHTML='<option value="all">Semua tipe</option>'+opts.map(function(t){return '<option value="'+esc(t)+'"'+(t===cur?' selected':'')+'>'+esc(t)+'</option>'}).join('');
    var all={}; TIPE_DEFAULT.concat(opts).forEach(function(t){all[t]=1});
    var ft=$('f-tipe'), prev=ft.value||'Full Time';
    ft.innerHTML=Object.keys(all).map(function(t){return '<option value="'+esc(t)+'"'+(t===prev?' selected':'')+'>'+esc(t)+'</option>'}).join('');
    var infos={}; INFO_DEFAULT.forEach(function(t){infos[t]=1}); rows.forEach(function(r){ if(r.info) infos[r.info]=1 });
    $('infolist').innerHTML=Object.keys(infos).map(function(t){return '<option value="'+esc(t)+'"></option>'}).join('');
  }

  function render(){ renderStats(); renderList(); }

  function showSetup(on,message){
    $('setup').hidden=!on; $('appmain').hidden=on;
    if(on){ $('setupmsg').textContent=message||''; $('setupmsg').className='msg'+(message?' err':''); }
  }

  async function load(){
    $('refresh').disabled=true;
    if(!loaded) setSync('Memuat dari Google Sheets…');
    try{
      var vals=await api('rows');
      rows=parseRows(vals); loaded=true; banner(''); writeCache(vals);
      setSync('Tersambung ke sheet Jobs Tracker · '+rows.length+' lamaran · diperbarui '+clock());
      renderTipeFilter();
      $('addbtn').disabled=false;
    }catch(e){
      if(String(e&&e.message)==='BAD_KEY'){ clearAll(); loaded=false; rows=[]; showSetup(true,'Kata sandi salah atau sudah diganti. Masukkan lagi.'); return; }
      banner(errText(e,'membaca'));
      setSync(loaded?'Gagal memperbarui. Data di bawah adalah data tersimpan terakhir.':'Belum bisa membaca Google Sheets.');
    }finally{
      $('refresh').disabled=false; render();
    }
  }

  function msg(t,kind){ var m=$('formmsg'); m.textContent=t||''; m.className='msg'+(kind?' '+kind:'') }

  /* ---------- sambungan awal ---------- */
  $('setupform').addEventListener('submit',async function(ev){
    ev.preventDefault();
    var url=$('s-url').value.trim(), key=$('s-key').value;
    var m=$('setupmsg'); m.className='msg';
    if(url.indexOf(API_PREFIX)!==0||!/\/exec$/.test(url.split('?')[0])){
      m.className='msg err'; m.textContent='Alamat harus diawali '+API_PREFIX+' dan berakhiran /exec.'; return;
    }
    $('setupbtn').disabled=true; m.textContent='Menghubungkan…';
    try{
      var vals=await api('rows',null,{url:url,key:key});
      setCfg({url:url,key:key}); writeCache(vals);
      $('s-key').value='';
      rows=parseRows(vals); loaded=true;
      showSetup(false); banner('');
      setSync('Tersambung ke sheet Jobs Tracker · '+rows.length+' lamaran · diperbarui '+clock());
      renderTipeFilter(); $('addbtn').disabled=false; $('refresh').disabled=false; render();
    }catch(e){
      m.className='msg err'; m.textContent=errText(e,'membaca');
    }finally{ $('setupbtn').disabled=false }
  });

  $('logout').addEventListener('click',function(){
    var b=this;
    if(!logoutArmed){
      b.textContent='Yakin? Ketuk lagi';
      logoutArmed=setTimeout(function(){logoutArmed=null;b.textContent='Putuskan'},3500); return;
    }
    clearTimeout(logoutArmed); logoutArmed=null; b.textContent='Putuskan';
    clearAll(); loaded=false; rows=[]; $('addbtn').disabled=true;
    showSetup(true,'Terputus. Data tersimpan dan kata sandi dihapus dari perangkat ini.');
    $('setupmsg').className='msg';
  });

  /* ---------- interaksi ---------- */
  $('stats').addEventListener('click',function(ev){
    var b=ev.target.closest('button[data-status]'); if(!b) return;
    filt.status=(filt.status===b.dataset.status&&b.dataset.status!=='all')?'all':b.dataset.status; render();
  });
  $('q').addEventListener('input',function(){filt.q=this.value;renderList()});
  $('ftipe').addEventListener('change',function(){filt.tipe=this.value;renderList()});
  $('refresh').addEventListener('click',load);

  $('list').addEventListener('change',async function(ev){
    var sel=ev.target.closest('select[data-row]'); if(!sel) return;
    var r=rows.filter(function(x){return x.row===+sel.dataset.row})[0], def=statusDef(sel.value);
    if(!r||!def||r.pending) return;
    var prev=r.statusRaw; r.pending=true; r.statusRaw=def.write; render();
    try{
      await api('status',{row:r.row,company:r.perusahaan,status:def.write});
      r.pending=false; banner('');
      setSync('Status '+(r.perusahaan||'lamaran')+' diubah menjadi '+def.label+' · '+clock()); render();
    }catch(e){
      r.statusRaw=prev; r.pending=false;
      var m=String(e&&e.message);
      if(m==='BAD_KEY'){ clearAll(); loaded=false; rows=[]; showSetup(true,'Kata sandi salah atau sudah diganti. Masukkan lagi.'); return; }
      banner(errText(e,'menyimpan'),m==='SHEET_CHANGED'); render();
      if(m==='SHEET_CHANGED') load();
    }
  });

  function dupHint(){
    var c=norm($('f-company').value), h=$('duphint');
    if(!c||!loaded){h.textContent='';return}
    var hits=rows.filter(function(r){return norm(r.perusahaan)===c});
    if(!hits.length){h.textContent='';return}
    hits.sort(function(a,b){return (b.t||0)-(a.t||0)});
    h.textContent='Sudah ada '+hits.length+' lamaran ke perusahaan ini, terakhir '+showDate(hits[0].t,hits[0].tanggalRaw)+' ('+hits[0].posisi+').';
  }
  $('f-company').addEventListener('input',dupHint);

  $('addform').addEventListener('submit',async function(ev){
    ev.preventDefault();
    if(busy||!loaded) return;
    var def=statusDef($('f-status').value)||STATUSES[0];
    var v={
      date:$('f-date').value, status:def.write,
      company:$('f-company').value.trim(), position:$('f-pos').value.trim(),
      tipe:$('f-tipe').value, info:$('f-info').value.trim(), industri:$('f-industri').value.trim()
    };
    if(!v.company||!v.position){ msg('Isi nama perusahaan dan posisi.','err'); return; }
    busy=true; $('addbtn').disabled=true; msg('Menyimpan ke Google Sheets…');
    try{
      var res=await api('add',v);
      msg(v.company+' ditambahkan sebagai nomor '+res.no+'.','ok');
      $('f-company').value='';$('f-pos').value='';$('f-industri').value='';$('duphint').textContent='';
      await load();
    }catch(e){
      msg(errText(e,'menyimpan')+' Tekan Muat ulang untuk memeriksa sheet sebelum mencoba lagi.','err');
    }finally{
      busy=false; $('addbtn').disabled=!loaded;
    }
  });

  /* ---------- mulai ---------- */
  $('f-date').value=todayISO();
  $('f-status').innerHTML=STATUSES.map(function(s){return '<option value="'+s.key+'">'+s.label+'</option>'}).join('');
  $('f-tipe').innerHTML=TIPE_DEFAULT.map(function(t){return '<option>'+t+'</option>'}).join('');
  $('infolist').innerHTML=INFO_DEFAULT.map(function(t){return '<option value="'+t+'"></option>'}).join('');
  try{ if(window.matchMedia&&window.matchMedia('(max-width: 860px)').matches) $('adddetails').open=false }catch(_){}

  if(!getCfg()){ showSetup(true); }
  else{
    showSetup(false);
    var cached=readCache();
    if(cached){
      rows=parseRows(cached); loaded=true; renderTipeFilter(); $('addbtn').disabled=false;
      setSync('Menampilkan data tersimpan · memperbarui…');
    }
    render(); load();
  }

  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}) });
  }
})();
</script>
</body>
</html>
